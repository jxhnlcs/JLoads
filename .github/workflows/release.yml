name: Release

# Publica uma versão baixável ao enviar uma tag: git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Pacote e release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Testes do backend
        working-directory: backend
        run: sh mvnw -B -ntp verify

      - name: Gerar pacote
        run: sh scripts/build-release.sh "${GITHUB_REF_NAME#v}"

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/jloads-$VERSION.zip" \
            "dist/jloads-$VERSION.jar" \
            "dist/SHA256SUMS.txt" \
            --title "JLoads $VERSION" \
            --generate-notes
